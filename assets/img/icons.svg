<!--
  icons.svg: every icon on the site, drawn as simple lines on a 24 by 24 grid.

  How to use one in a page:
    <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#i-paper"></use></svg>
  (From a page inside a folder, such as tools/index.html, start the path with ../)

  Safe to edit: add a new <symbol> with a new id, or change a path.
  Icons take their color from the surrounding text, so do not add colors here.
-->
<svg xmlns="http://www.w3.org/2000/svg">

  <!-- Research lines -->
  <symbol id="i-variability" viewBox="0 0 24 24">
    <path d="M2 20h20"/>
    <path d="M2 20c4 0 5-14 10-14s6 14 10 14"/>
    <path d="M8.5 20c1.5 0 2-6 3.5-6s2 6 3.5 6"/>
  </symbol>
  <symbol id="i-dynamics" viewBox="0 0 24 24">
    <path d="M4 12a8 8 0 0 1 14-5.3"/>
    <path d="M18 2.5v4.2h-4.2"/>
    <path d="M20 12a8 8 0 0 1-14 5.3"/>
    <path d="M6 21.5v-4.2h4.2"/>
  </symbol>
  <symbol id="i-latent" viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="3"/>
    <path d="M10.5 7.6 4.5 16M12 8v8M13.5 7.6l6 8.4"/>
    <rect x="2" y="16" width="5" height="5" rx="0.5"/>
    <rect x="9.5" y="16" width="5" height="5" rx="0.5"/>
    <rect x="17" y="16" width="5" height="5" rx="0.5"/>
  </symbol>
  <symbol id="i-adaptive" viewBox="0 0 24 24">
    <path d="M3 21h4v-4h4v-5h4V8h4V4"/>
    <circle cx="19" cy="4" r="1.6"/>
  </symbol>
  <symbol id="i-language" viewBox="0 0 24 24">
    <path d="M3 4h18v12H10l-5 4.5V16H3z"/>
    <path d="M8 10h.01M12 10h.01M16 10h.01"/>
  </symbol>

  <symbol id="i-work" viewBox="0 0 24 24">
    <rect x="2.5" y="7" width="19" height="13" rx="1.5"/>
    <path d="M8.5 7V4.5h7V7M2.5 12.5h19M12 11v3"/>
  </symbol>

  <!-- Things: data, papers, code -->
  <symbol id="i-dataset" viewBox="0 0 24 24">
    <ellipse cx="12" cy="5" rx="8" ry="3"/>
    <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </symbol>
  <symbol id="i-paper" viewBox="0 0 24 24">
    <path d="M5 2h10l5 5v15H5z"/>
    <path d="M15 2v5h5M8.5 12h8M8.5 16h6"/>
  </symbol>
  <symbol id="i-preprint" viewBox="0 0 24 24">
    <path d="M5 2h10l5 5v15H5z"/>
    <path d="M15 2v5h5"/>
    <circle cx="12" cy="14.5" r="4"/>
    <path d="M12 12.5v2l1.4 1"/>
  </symbol>
  <symbol id="i-code" viewBox="0 0 24 24">
    <path d="M8 6.5 2.5 12 8 17.5M16 6.5l5.5 5.5-5.5 5.5M13.6 4l-3.2 16"/>
  </symbol>
  <symbol id="i-cite" viewBox="0 0 24 24">
    <path d="M10 6H4v6h6v1c0 3-1.5 4.5-4.5 5.5"/>
    <path d="M20 6h-6v6h6v1c0 3-1.5 4.5-4.5 5.5"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 3v12M6.5 9.5 12 15l5.5-5.5M4 20.5h16"/>
  </symbol>
  <symbol id="i-news" viewBox="0 0 24 24">
    <path d="M4 4h13v16H6a2 2 0 0 1-2-2z"/>
    <path d="M17 8h3v10a2 2 0 0 1-2 2h-1M7.5 8h6M7.5 12h6M7.5 16h4"/>
  </symbol>

  <!-- Contact and profiles -->
  <symbol id="i-mail" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="14" rx="1"/>
    <path d="m3 6.5 9 6.5 9-6.5"/>
  </symbol>
  <symbol id="i-orcid" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"/>
    <path d="M8 10.5V17M8 7.3h.01M11 7.5V17h2.3a4.75 4.75 0 0 0 0-9.5z"/>
  </symbol>
  <symbol id="i-scholar" viewBox="0 0 24 24">
    <path d="M1.5 9.5 12 4l10.5 5.5L12 15z"/>
    <path d="M6 12v4.5c2.5 2.6 9.5 2.6 12 0V12M22.5 9.5v5"/>
  </symbol>

  <!-- Day and night switch -->
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/>
  </symbol>
</svg>
